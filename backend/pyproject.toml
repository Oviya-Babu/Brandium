[tool.poetry]
name = "brandium-backend"
version = "0.1.0"
description = "BrandGuard AI — Enterprise Brand Decision Intelligence Platform backend (modular monolith)"
authors = ["Brandium Engineering"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.30.0"
alembic = "^1.13.3"
redis = "^5.2.0"
celery = "^5.4.0"
qdrant-client = "^1.12.0"
boto3 = "^1.35.0"
ollama = "^0.4.0"
groq = "^0.13.0"
structlog = "^24.4.0"
python-multipart = "^0.0.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
hypothesis = "^6.115.0"
ruff = "^0.7.4"
mypy = "^1.13.0"
pre-commit = "^4.0.1"
httpx = "^0.27.2"
aiosqlite = "^0.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
mypy_path = "."
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*", "ollama.*", "groq.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
